events {
    worker_connections 1024;
}

http {
    upstream edge_ai {
        server edge-ai:8000;
    }

    upstream content_filter {
        server content-filter:8000;
    }

    upstream auth {
        server auth:8000;
    }

    upstream parental_controls {
        server parental-controls:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }

        # Edge AI routes
        location /api/ai/ {
            proxy_pass http://edge_ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Content Filter routes
        location /api/filter/ {
            proxy_pass http://content_filter/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth routes
        location /api/auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Parental Controls routes
        location /api/dashboard/ {
            proxy_pass http://parental_controls/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/controls/ {
            proxy_pass http://parental_controls/controls/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}